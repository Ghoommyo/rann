<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rann Admin</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <!-- Log in -->
  <main id="login" class="login" hidden>
    <form id="login-form" class="card login-card" novalidate>
      <img class="logo" src="icon.png" alt="" width="64" height="64">
      <h1>RANN ADMIN</h1>
      <p class="muted">Log in to manage the game.</p>
      <label>Email <input name="email" type="email" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="error" hidden></p>
      <button type="submit" class="primary">Log in</button>
    </form>
  </main>

  <!-- Everything after logging in -->
  <div id="portal" hidden>
    <header class="topbar">
      <a class="brand" href="#/dashboard"><img src="icon.png" alt="" width="28" height="28">RANN ADMIN</a>
      <div class="menu">
        <button id="menu-button" class="menu-button" aria-haspopup="true" aria-expanded="false" aria-controls="menu-list">
          <span id="admin-email" class="muted"></span>
          <span aria-hidden="true">☰</span><span class="sr-only">Menu</span>
        </button>
        <nav id="menu-list" class="menu-list" hidden>
          <a href="#/dashboard">Dashboard</a>
          <a href="#/users">Users</a>
          <a href="#/players">Players</a>
          <button id="logout" type="button">Log out</button>
        </nav>
      </div>
    </header>

    <main class="page">
      <section id="page-dashboard" hidden>
        <h2>Dashboard</h2>
        <div id="tiles" class="tiles"></div>
        <div class="charts">
          <figure class="card chart" id="chart-signups"></figure>
          <figure class="card chart" id="chart-matches"></figure>
          <figure class="card chart" id="chart-players"></figure>
          <figure class="card chart" id="chart-picks"></figure>
        </div>
        <div class="card">
          <h3>Top players</h3>
          <div id="top-players"></div>
        </div>
      </section>

      <section id="page-users" hidden>
        <h2>Users</h2>
        <div class="toolbar">
          <div class="tabs" role="tablist">
            <button role="tab" data-status="active">Active</button>
            <button role="tab" data-status="inactive">Inactive</button>
          </div>
          <input id="user-search" type="search" placeholder="Search username or email">
        </div>
        <p id="users-summary" class="muted"></p>
        <div id="users-list"></div>
        <div class="pager">
          <button id="prev-page" type="button">‹ Previous</button>
          <button id="next-page" type="button">Next ›</button>
        </div>
      </section>

      <section id="page-players" hidden>
        <h2>Players</h2>
        <p class="muted">Fighters players can pick in character select. Inactive ones show as “?”.</p>
        <div class="toolbar">
          <div class="tabs" role="tablist">
            <button role="tab" data-unlocked="true">Active</button>
            <button role="tab" data-unlocked="false">Inactive</button>
          </div>
        </div>
        <div id="fighters-list" class="fighters"></div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <div id="tooltip" class="tooltip" hidden></div>
  <script src="admin.js"></script>
</body>
</html>
